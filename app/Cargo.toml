[package]
name = "telacast"
version = "0.1.23"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37.0"
openh264 = "0.9.9"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "1"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
x11rb = { version = "0.14.0", features = ["randr"] }
telacast-proto = { version = "0.1.0", path = "../proto" }
serde_json = "1.0.154"
chrono = "0.4.45"
sha2 = "0.10"
ed25519-dalek = "2"
cpal = "0.16"
opus = "0.4"
rtrb = "0.3"
nnnoiseless = { version = "0.5", default-features = false }
telacast-md = { path = "../md" }
telacast-qs = { path = "../qs" }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
windows-capture = "2.0.1"
wasapi = "0.27"

[target.'cfg(any(unix, windows))'.dependencies]
nvidia-video-codec-sdk = { path = "../vendor/nvidia-video-codec-sdk" }
cudarc = { version = "0.16", default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-12080"] }
