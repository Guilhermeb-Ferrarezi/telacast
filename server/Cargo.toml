[package]
name = "telacast-server"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
futures-util = "0.3.34"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
telacast-proto = { version = "0.1.0", path = "../proto" }
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.1", features = ["v4"] }
